spring.datasource.url=jdbc:mysql://localhost:3306/db_acosta
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET}
app.ml.base-url=http://localhost:8000
app.chequea.pe.api-key=${CHEQUEA_API_KEY}
app.chequea.pe.url=${CHEQUEA_API_URL}
app.tomtom.api-key=${TOMTOM_API_KEY}
app.whatsapp.token=${WHATSAPP_TOKEN}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER}

app.r2.account.id=${R2_ACCOUNT_ID}
app.r2.access.key.id=${R2_ACCESS_KEY_ID}
app.r2.secret.access.key=${R2_SECRET_ACCESS_KEY}
app.r2.bucket=${R2_BUCKET}
app.r2.endpoint=${R2_ENDPOINT}

springdoc.swagger-ui.enabled=true