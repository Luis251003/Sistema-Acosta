spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET}
app.ml.base-url=${ML_BASE_URL}
app.tomtom.api-key=${TOMTOM_API_KEY}
app.whatsapp.token=${WHATSAPP_TOKEN}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_ID}
app.azure-communication.connection-string=${ACS_CONNECTION_STRING}

springdoc.swagger-ui.enabled=false

